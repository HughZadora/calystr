name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.14.1
      - name: Verify frozen structure and Node contracts
        run: npm test
      - name: Validate CUE model
        run: cue vet ./...
