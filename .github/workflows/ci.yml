name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.1.0
          install: false
          require-lockfile: true
      - name: Install frozen Node dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify runtime contract
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(pnpm --version)" = "12.1.0"
      - name: Run changed-file quality gates
        run: pnpm run quality:diff -- --diff="${{ github.event.pull_request.base.sha || github.event.before }}...HEAD"
      - name: Type-check TypeScript boundary
        run: pnpm run typecheck
      - name: Detect dead code and dependency drift
        run: pnpm run lint:dead-code
      - name: Verify package publication contract
        run: pnpm run lint:package
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install pinned native verification tools
        run: |
          go install cuelang.org/go/cmd/cue@v0.17.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          go install github.com/gitleaks/gitleaks/v8@v8.30.0
          curl -fsSL --retry 3 -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/download/v1.20.1/opa_linux_amd64_static
          echo '0b3f152e61be276b70396cfbca49e39fc9d0c5089e0a8574e8f6a30f41a9187f  /usr/local/bin/opa' | sha256sum --check --strict
          chmod +x /usr/local/bin/opa
      - name: Report verification tool versions
        run: |
          go version
          cue version
          actionlint -version
          osv-scanner --version
          gitleaks version
          opa version
      - name: Validate GitHub Actions semantics
        run: actionlint -color=never
      - name: Verify secret scanner health and repository history
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks-canary"
          printf 'github_token = "ghp_%s"\n' "$(openssl rand -hex 18)" > "${RUNNER_TEMP}/gitleaks-canary/canary.txt"
          set +e
          gitleaks dir "${RUNNER_TEMP}/gitleaks-canary" --no-banner --redact --exit-code 97
          canary_status=$?
          set -e
          rm -rf "${RUNNER_TEMP}/gitleaks-canary"
          test "${canary_status}" -eq 97
          gitleaks git --no-banner --redact
      - name: Scan locked dependencies for known vulnerabilities
        run: osv-scanner scan -L pnpm-lock.yaml
      - name: Run project tests
        run: pnpm test
      - name: Measure source coverage
        run: pnpm run coverage
      - name: Validate CUE model
        run: cue vet ./...
      - name: Test OPA policy
        run: opa test policy/rego -v
      - name: Generate CycloneDX SBOM
        run: pnpm run sbom > "${RUNNER_TEMP}/calystr.cdx.json"
      - name: Verify golden compiler command
        run: pnpm run golden > "${RUNNER_TEMP}/calystr-golden.json"
      - name: Verify distributable package
        run: pnpm pack --pack-destination "${RUNNER_TEMP}"

  actions-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: '1.29.0'
          online-audits: false
          advanced-security: false
          annotations: true
          color: false
