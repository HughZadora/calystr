name: Release provenance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.1.0
          install: false
          require-lockfile: true
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pack release artifact
        id: pack
        run: |
          pnpm pack --json --pack-destination "${RUNNER_TEMP}" > "${RUNNER_TEMP}/pnpm-pack.json"
          node -e "const fs=require('fs'); const [p]=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pnpm-pack.json','utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'artifact='+p.filename+'\\n')"
      - name: Generate SLSA provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ steps.pack.outputs.artifact }}'
      - name: Preserve packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'calystr-${{ github.ref_name }}'
          path: '${{ steps.pack.outputs.artifact }}'
          if-no-files-found: error
