name: Repair formatting

on:
  push:
    branches:
      - chore/pnpm-security-toolchain

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.1.0
          install: false
          require-lockfile: true
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply repository Prettier contract
        run: |
          pnpm exec prettier --write \
            .c8rc.json \
            .github/dependabot.yml \
            .github/workflows/ci.yml \
            knip.json \
            adapters/pi/runtime-contract.mjs \
            compiler/parse/index.mjs \
            mappings/solution/index.mjs \
            standard/design/index.mjs
      - name: Finalise format repair
        run: |
          rm .github/workflows/format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(toolchain): apply canonical repository formatting"
          git push
