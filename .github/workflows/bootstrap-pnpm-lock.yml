name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - chore/pnpm-security-toolchain
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/bootstrap-pnpm-lock.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0
        with:
          version: 12.1.0
          install: false
      - name: Generate single-document project lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify frozen install resolves without compatibility escape flags
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Assert lockfile remains scanner-compatible
        run: test "$(grep -c '^---$' pnpm-lock.yaml)" -le 1
      - name: Preserve generated lockfile
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
