name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - chore/pnpm-security-toolchain
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/bootstrap-pnpm-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2.1.0
        with:
          version: 12.1.0
          install: false
      - name: Generate single-document project lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify frozen install and pinned runtime
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          test "$(node --version)" = "v24.20.0"
      - name: Assert lockfile remains scanner-compatible
        run: test "$(grep -c '^---$' pnpm-lock.yaml)" -le 1
      - name: Finalise lockfile bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-pnpm-lock.yml
          git add pnpm-lock.yaml
          git commit -m "chore(toolchain): lock pnpm dependency graph"
          git push
