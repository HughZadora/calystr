name: Refresh pnpm lockfile

on:
  push:
    branches:
      - chore/pnpm-security-toolchain
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/refresh-pnpm-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.1.0
          install: false
          require-lockfile: true
      - name: Refresh and verify dependency graph
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          test "$(node --version)" = "v24.20.0"
          test "$(grep -c '^---$' pnpm-lock.yaml)" -le 1
      - name: Commit refreshed lockfile and remove migration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-pnpm-lock.yml
          git add pnpm-lock.yaml
          git commit -m "chore(toolchain): refresh pnpm quality dependencies"
          git push
